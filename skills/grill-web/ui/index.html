<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grill</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  /* 색 토큰. 중립 회색으로 구조를 잡고, 강조는 테마색 하나만 쓴다. 의미색은 상태 표시에만. */
  :root {
    --bg: #fcfcfc;
    --surface: #ffffff;
    --ink: #222222;
    --ink-2: #555555;
    --ink-disabled: #b0b0b0;
    --placeholder: #c7c7c7;
    --line: #c7c7c7;
    --line-weak: #e4e4e4;
    --bg-disabled: #f0f0f0;
    --theme: #fa4d02;
    --theme-tint: rgba(250, 77, 2, 0.07);
    --theme-tint-2: rgba(250, 77, 2, 0.14);
    --positive: #3e9b4f;
    --critical: #ce2c31;
    --r-xs: 8px; --r-s: 12px; --r-m: 16px;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: var(--font); font-size: 16px; line-height: 24px; -webkit-font-smoothing: antialiased; word-break: keep-all; }
  /* 자간은 앱 컨테이너에만 준다. body에 주면 mermaid가 body에 붙여 재는 글자 폭이 틀어져 라벨이 잘린다. */
  .shell { letter-spacing: -0.02em; }
  button, textarea, input { font: inherit; letter-spacing: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* 폭은 화면에 맞춰 늘어난다. 너무 넓은 화면에서만 1720px에서 멈춘다. */
  .shell { display: grid; grid-template-columns: minmax(220px, 260px) minmax(0, 1fr); gap: clamp(32px, 4vw, 72px); max-width: 1720px; margin: 0 auto; padding: 56px clamp(24px, 4vw, 80px) 120px; }
  aside { position: sticky; top: 56px; align-self: start; }
  main { min-width: 0; container-type: inline-size; }

  .caption { font-size: 12px; line-height: 16px; color: var(--ink-2); }
  aside h1 { font-size: 20px; line-height: 28px; font-weight: 700; margin: 4px 0 0; }
  aside .meta { font-size: 14px; line-height: 20px; color: var(--ink-2); margin-top: 2px; }

  .nav { margin-top: 28px; border-top: 1px solid var(--line-weak); padding-top: 12px; }
  .nav .row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font-size: 14px; line-height: 20px; color: var(--ink-2); padding: 6px 0; }
  .nav .row.head { font-weight: 600; color: var(--ink); margin-top: 6px; }
  .nav .row.q { padding-left: 18px; }
  .nav .row.q:hover { color: var(--ink); }
  .nav .mark { flex: none; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line); }
  .nav .mark.done { background: var(--ink); border-color: var(--ink); }
  .nav .mark.now { border-color: var(--theme); background: var(--theme); }
  .nav .row.head.now { color: var(--theme); }

  .side-cta { margin-top: 24px; }
  .side-cta .hint { font-size: 14px; line-height: 20px; color: var(--ink-2); margin: 0 0 8px; }
  .send { display: block; width: 100%; height: 48px; border-radius: var(--r-s); background: var(--theme); color: #fff; font-size: 15px; font-weight: 600; transition: filter .12s, transform .08s; }
  .send:hover { filter: brightness(.94); }
  .send:active { transform: scale(.99); }
  .send:disabled { background: var(--bg-disabled); color: var(--ink-disabled); cursor: default; filter: none; }
  .ghost { display: block; width: 100%; height: 40px; margin-top: 8px; border-radius: var(--r-xs); border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; color: var(--ink-2); }
  .ghost:hover { color: var(--ink); border-color: var(--ink); }

  .round-title { font-size: 28px; line-height: 36px; font-weight: 700; margin: 4px 0 20px; }

  .card { background: var(--surface); border: 1px solid var(--line-weak); border-radius: var(--r-m); padding: 28px 32px; margin-top: 16px; display: grid; grid-template-columns: 1fr; gap: 24px; scroll-margin-top: 24px; }
  @container (min-width: 900px) {
    .card { grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr); gap: clamp(32px, 4cqw, 64px); padding: 32px 40px; }
  }
  @container (min-width: 1300px) {
    .card { grid-template-columns: minmax(0, 1.5fr) minmax(360px, 1fr); }
    .q-body { font-size: 16px; line-height: 24px; }
    .q-title { font-size: 22px; line-height: 30px; }
  }
  .card .ask, .card .answer { min-width: 0; }
  .ask .caption { color: var(--theme); font-weight: 600; }
  .q-title { font-size: 20px; line-height: 28px; font-weight: 700; margin: 4px 0 0; }
  .q-body { color: #3a3a3a; font-size: 15px; line-height: 22px; margin-top: 10px; }
  .q-body > *:first-child { margin-top: 0; }
  .q-body p { margin: 0 0 10px; }
  .q-body ul, .q-body ol { margin: 4px 0 10px; padding-left: 22px; }
  .q-body h2, .q-body h3, .q-body h4 { color: var(--ink); font-size: 15px; margin: 16px 0 6px; }
  strong { color: var(--ink); font-weight: 600; }
  code { font-family: var(--mono); font-size: 0.86em; background: var(--bg-disabled); padding: 1px 5px; border-radius: 4px; }
  pre { font-family: var(--mono); font-size: 13px; line-height: 20px; background: var(--bg-disabled); border-radius: var(--r-xs); padding: 12px 14px; overflow-x: auto; margin: 10px 0; }
  pre code { background: none; padding: 0; font-size: inherit; }
  table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; line-height: 20px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-weak); vertical-align: top; }
  th { font-weight: 600; color: var(--ink); border-bottom-color: var(--line); background: var(--bg-disabled); }
  th:first-child { border-top-left-radius: 6px; } th:last-child { border-top-right-radius: 6px; }
  img { max-width: 100%; border-radius: var(--r-xs); display: block; margin: 10px 0; }
  figure { margin: 12px 0; }
  figcaption { font-size: 12px; line-height: 16px; color: var(--ink-2); margin-top: 6px; }
  .mm { letter-spacing: 0; margin: 12px 0; padding: 12px; background: var(--bg); border: 1px solid var(--line-weak); border-radius: var(--r-xs); overflow-x: auto; }
  .mm svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  .mm.err { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: pre-wrap; }
  .fig { margin: 12px 0; overflow-x: auto; }
  .fig svg { max-width: 100%; height: auto; display: block; }
  .raw { margin: 12px 0; }

  /* 블록: 나란히 비교 */
  .cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; margin: 12px 0; }
  .cmp.n1 { grid-template-columns: 1fr; }
  .cmp-col { border: 1px solid var(--line-weak); border-radius: var(--r-xs); padding: 12px 14px; font-size: 14px; line-height: 20px; }
  .cmp-title { font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .cmp-col ul { margin: 0; padding-left: 18px; }
  .cmp-note { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-weak); color: var(--ink-2); }
  /* 블록: 단계 */
  .steps { list-style: none; margin: 12px 0; padding: 0; counter-reset: s; }
  .steps li { position: relative; padding: 0 0 14px 34px; counter-increment: s; font-size: 14px; line-height: 20px; }
  .steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 600; color: var(--ink); display: grid; place-items: center; }
  .steps li::after { content: ""; position: absolute; left: 10.5px; top: 24px; bottom: 0; border-left: 1px solid var(--line-weak); }
  .steps li:last-child::after { display: none; }
  .steps .st { font-weight: 600; color: var(--ink); }
  /* 블록: diff */
  pre.diff { padding: 0; }
  pre.diff .l { display: block; padding: 0 14px; }
  pre.diff .l:first-child { padding-top: 10px; } pre.diff .l:last-child { padding-bottom: 10px; }
  pre.diff .add { background: rgba(62,155,79,.12); }
  pre.diff .del { background: rgba(206,44,49,.10); }
  pre.diff .hd { color: var(--ink-2); }
  /* 블록: 메모 */
  .callout { margin: 12px 0; padding: 10px 14px; border-left: 2px solid var(--theme); background: var(--theme-tint); font-size: 14px; line-height: 20px; color: var(--ink-2); }

  .why { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line-weak); font-size: 14px; line-height: 20px; color: var(--ink-2); }
  .why .label { display: block; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--theme); margin-bottom: 2px; }

  .answer .label { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-2); margin: 8px 0 10px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); font-size: 15px; line-height: 22px; transition: border-color .1s, box-shadow .1s; }
  .opt:hover { border-color: var(--ink-2); }
  .opt.on { border-color: var(--theme); box-shadow: inset 0 0 0 1px var(--theme); background: var(--theme-tint); }
  .opt .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); position: relative; }
  .opt .dot.sq { border-radius: 5px; }
  .opt.on .dot { border-color: var(--theme); background: var(--theme); }
  .opt.on .dot::after { content: ""; position: absolute; left: 5px; top: 1.5px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .pill { margin-left: auto; flex: none; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--theme); background: var(--theme-tint-2); border-radius: 999px; padding: 2px 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg .opt { justify-content: center; font-weight: 600; }
  .seg .opt .pill { margin-left: 8px; }

  textarea, input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: var(--r-s); padding: 12px 14px; background: var(--surface); resize: vertical; min-height: 120px; outline: none; font-size: 15px; line-height: 22px; transition: border-color .1s; }
  input[type=text] { min-height: 0; }
  textarea::placeholder, input::placeholder { color: var(--placeholder); }
  textarea:focus, input[type=text]:focus { border-color: var(--ink); }
  .other input { display: none; margin-top: 8px; }
  .other.on input { display: block; }

  .range { padding: 4px 2px; }
  .range .val { font-size: 28px; line-height: 36px; font-weight: 700; }
  .range .val small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
  .range .val.empty { color: var(--ink-disabled); }
  .range input[type=range] { width: 100%; margin: 10px 0 4px; accent-color: var(--theme); }
  .range input[type=range].empty { opacity: .45; }
  .range .ends { display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; color: var(--ink-2); }

  .rec { margin-bottom: 10px; padding: 10px 14px; background: var(--theme-tint); border-radius: var(--r-s); font-size: 14px; line-height: 20px; display: flex; gap: 12px; align-items: flex-start; }
  .rec .tag { flex: none; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--theme); padding-top: 2px; }
  .rec .txt { flex: 1; }
  .rec button { flex: none; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: var(--r-xs); border: 1px solid var(--line); background: var(--surface); }
  .rec button:hover { border-color: var(--ink); }

  .later { margin-top: 14px; display: flex; gap: 16px; align-items: center; }
  .later button, .note-toggle { font-size: 14px; line-height: 20px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
  .later button:hover, .note-toggle:hover { color: var(--ink); }
  .card.skipped { background: var(--bg); }
  .card.skipped .ask { opacity: .55; }
  .skipbox { border: 1px dashed var(--line); border-radius: var(--r-s); padding: 16px; font-size: 14px; line-height: 20px; color: var(--ink-2); }
  .skipbox b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }
  .skipbox button { margin-top: 10px; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: var(--r-xs); border: 1px solid var(--line); background: var(--surface); }
  .skipbox button:hover { border-color: var(--ink); }
  .nav .mark.skip { border-style: dashed; border-color: var(--ink-2); }
  .q-head { display: flex; align-items: center; gap: 8px; }
  .q-head .pill { margin-left: 0; }
  .note { margin-top: 0; }
  .note textarea { display: none; min-height: 80px; font-size: 14px; }
  .note.on .note-toggle { display: none; }
  .note.on textarea { display: block; }

  .bottom { margin-top: 24px; display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
  .bottom .hint { font-size: 14px; color: var(--ink-2); }
  .bottom .send { width: 240px; }

  .history { margin-top: 48px; }
  .history .caption { margin-bottom: 8px; }
  details.past { border-top: 1px solid var(--line-weak); }
  details.past summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 14px 0; font-size: 15px; font-weight: 600; color: var(--ink-2); }
  details.past summary::-webkit-details-marker { display: none; }
  details.past summary .chev { color: var(--ink-disabled); transition: transform .15s; font-size: 12px; }
  details.past[open] summary .chev { transform: rotate(180deg); }
  .past-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 0 0 20px; }
  .past-q { background: var(--surface); border: 1px solid var(--line-weak); border-radius: var(--r-s); padding: 12px 16px; }
  .past-q .t { font-size: 13px; line-height: 18px; color: var(--ink-2); }
  .past-q .a { font-size: 15px; line-height: 22px; font-weight: 600; margin-top: 4px; }
  .past-q .n { font-size: 13px; line-height: 18px; color: var(--ink-2); margin-top: 4px; white-space: pre-wrap; }

  .waiting { padding: 64px 24px; text-align: center; color: var(--ink-2); }
  .waiting .big { font-size: 18px; line-height: 26px; font-weight: 700; color: var(--ink); }
  .waiting .sub { font-size: 14px; line-height: 20px; margin-top: 4px; }
  .spin { width: 20px; height: 20px; margin: 0 auto 16px; border: 2px solid var(--line-weak); border-top-color: var(--theme); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .summary { max-width: 800px; }
  .summary h2 { font-size: 24px; line-height: 30px; margin: 28px 0 8px; }
  .summary h3 { font-size: 18px; line-height: 26px; margin: 24px 0 6px; }
  .summary h4 { font-size: 16px; margin: 18px 0 4px; }
  .summary p, .summary li { color: var(--ink-2); font-size: 15px; line-height: 22px; }
  .summary ul, .summary ol { padding-left: 22px; }
  .done-badge { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--positive); border: 1px solid var(--positive); border-radius: 999px; padding: 3px 10px; display: inline-block; }

  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 14px; padding: 10px 16px; border-radius: var(--r-xs); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  .offline { position: fixed; left: 0; right: 0; top: 0; padding: 10px 16px; text-align: center; font-size: 14px; background: var(--critical); color: #fff; z-index: 10; }
  .offline[hidden] { display: none; }

  @media (max-width: 1180px) {
    .shell { grid-template-columns: 1fr; gap: 24px; padding: 32px clamp(20px, 4vw, 48px) 100px; }
    aside { position: static; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line-weak); }
    aside .caption { width: 100%; }
    aside h1 { margin: 0; }
    .nav { display: none; }
    .side-cta { display: flex; align-items: center; gap: 12px; margin: 0 0 0 auto; }
    .side-cta .hint { margin: 0; }
    .side-cta .send { width: 160px; height: 40px; }
    .ghost { width: auto; height: 40px; margin: 0; padding: 0 14px; }
  }
  @media (max-width: 640px) {
    .card { padding: 20px; }
    .bottom { flex-direction: column; align-items: stretch; }
    .bottom .send { width: 100%; }
    .side-cta { width: 100%; margin: 8px 0 0; }
    .side-cta .send { flex: 1; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="offline" id="offline" role="alert" hidden>서버와 연결이 끊겼어요. 에이전트가 서버를 다시 띄우면 저절로 이어져요.</div>

<script src="/sanitize.js"></script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: false,
    htmlLabels: false,
    flowchart: { padding: 12, nodeSpacing: 40, rankSpacing: 56, htmlLabels: false },
    theme: "base",
    themeVariables: {
      fontFamily: '"Pretendard Variable", Pretendard, system-ui, sans-serif',
      fontSize: "14px",
      primaryColor: "#ffffff", primaryTextColor: "#222222", primaryBorderColor: "#c7c7c7",
      secondaryColor: "#f0f0f0", tertiaryColor: "#fcfcfc",
      lineColor: "#555555", textColor: "#222222", edgeLabelBackground: "#fcfcfc",
      clusterBkg: "#f0f0f0", clusterBorder: "#c7c7c7",
      noteBkgColor: "#f0f0f0", noteBorderColor: "#c7c7c7",
      actorBkg: "#ffffff", actorBorder: "#c7c7c7", actorTextColor: "#222222",
      signalColor: "#222222", signalTextColor: "#222222",
      labelBoxBkgColor: "#f0f0f0", labelBoxBorderColor: "#c7c7c7",
      pie1: "#222222", pie2: "#555555", pie3: "#b0b0b0", pie4: "#e4e4e4",
    },
  });
  window.__mermaid = mermaid;
  document.dispatchEvent(new Event("mermaid-ready"));
</script>

<script>
(() => {
  const side = document.getElementById("side");
  const main = document.getElementById("main");
  const toastEl = document.getElementById("toast");
  let last = null, lastStructure = null, lastState = null, currentRound = null, sessionId = null, sending = false;
  let drafts = {}, noteOpen = {};
  const svgCache = new Map();
  let mmSeq = 0;

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

  // 작은 마크다운. 문단, 제목, 목록, 표, 이미지, 코드블록, mermaid 펜스, 인라인 코드, 굵게, 링크.
  function md(src) {
    if (!src) return "";
    const lines = String(src).replace(/\r/g, "").split("\n");
    let out = "", para = [], list = [], listTag = "ul", table = [], code = null, lang = "";
    const flush = () => {
      if (para.length) { out += `<p>${para.map(inline).join("<br>")}</p>`; para = []; }
      if (list.length) { out += `<${listTag}>${list.map((l) => `<li>${inline(l)}</li>`).join("")}</${listTag}>`; list = []; }
      if (table.length) {
        const rows = table.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r)).map((r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
        const [head, ...body] = rows;
        out += tableHtml(head, body);
        table = [];
      }
    };
    for (const raw of lines) {
      if (code !== null) {
        if (raw.startsWith("```")) {
          out += lang === "mermaid" ? mermaidHtml(code.join("\n")) : lang === "diff" ? diffHtml(code.join("\n")) : `<pre><code>${esc(code.join("\n"))}</code></pre>`;
          code = null;
        } else code.push(raw);
        continue;
      }
      const line = raw.replace(/\s+$/, "");
      if (line.startsWith("```")) { flush(); code = []; lang = line.slice(3).trim(); continue; }
      if (!line.trim()) { flush(); continue; }
      if (/^\s*\|.*\|\s*$/.test(line)) { if (para.length || list.length) flush(); table.push(line); continue; }
      if (table.length) flush();
      const h = line.match(/^(#{1,4})\s+(.*)/);
      if (h) { flush(); const lv = Math.min(h[1].length + 1, 4); out += `<h${lv}>${inline(h[2])}</h${lv}>`; continue; }
      const ul = line.match(/^\s*[-*]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/);
      if (ul || ol) {
        const tag = ul ? "ul" : "ol";
        if (para.length || (list.length && listTag !== tag)) flush();
        listTag = tag; list.push((ul || ol)[1]); continue;
      }
      if (list.length) flush();
      para.push(line);
    }
    flush();
    return out;
  }

  const sanitize = (m) => (window.grillSanitize ? window.grillSanitize(m) : "");

  const mermaidHtml = (code) => `<div class="mm" data-src="${esc(code)}"></div>`;
  const tableHtml = (head, rows) => `<table><thead><tr>${(head ?? []).map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${(rows ?? []).map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  const diffHtml = (text) => `<pre class="diff">${text.split("\n").map((l) => {
    const cls = l.startsWith("+++") || l.startsWith("---") || l.startsWith("@@") ? "hd" : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "";
    return `<span class="l ${cls}">${esc(l) || " "}</span>`;
  }).join("")}</pre>`;

  // body: 마크다운 문자열, 또는 블록 배열. 블록은 모델이 짧은 JSON으로 그림을 요청하는 방법이다.
  function block(b) {
    if (b == null) return "";
    if (typeof b === "string") return md(b);
    switch (b.type) {
      case "md": return md(b.text);
      case "mermaid": return mermaidHtml(b.code);
      case "table": return tableHtml(b.head, b.rows);
      case "diff": return diffHtml(b.text);
      case "compare": {
        const cols = b.columns ?? [];
        return `<div class="cmp n${Math.min(cols.length, 4)}">${cols.map((c) => `<div class="cmp-col"><div class="cmp-title">${inline(c.title)}</div>${c.points?.length ? `<ul>${c.points.map((p) => `<li>${inline(p)}</li>`).join("")}</ul>` : ""}${c.note ? `<div class="cmp-note">${inline(c.note)}</div>` : ""}</div>`).join("")}</div>`;
      }
      case "steps": return `<ol class="steps">${(b.items ?? []).map((s) => typeof s === "string" ? `<li>${inline(s)}</li>` : `<li><span class="st">${inline(s.title)}</span>${s.text ? `<br>${inline(s.text)}` : ""}</li>`).join("")}</ol>`;
      case "callout": return `<div class="callout">${inline(b.text)}</div>`;
      case "img": return `<figure><img alt="${esc(b.alt)}" src="${esc(b.src)}">${b.caption ? `<figcaption>${inline(b.caption)}</figcaption>` : ""}</figure>`;
      case "svg": return `<div class="fig">${b.svg ?? ""}</div>`;
      case "html": return `<div class="raw">${b.html ?? ""}</div>`;
      default: return `<pre>${esc(JSON.stringify(b, null, 2))}</pre>`;
    }
  }
  // 마크다운, 블록, raw 전부 한 번에 정제한다. URL 허용 목록은 sanitize.js 한 곳에만 있다.
  const body = (v) => sanitize((Array.isArray(v) ? v : [v]).map(block).join(""));

  async function hydrateMermaid() {
    const boxes = [...document.querySelectorAll(".mm[data-src]:empty")];
    if (!boxes.length) return;
    if (!window.__mermaid) { document.addEventListener("mermaid-ready", hydrateMermaid, { once: true }); return; }
    // 웹폰트가 뜨기 전에 재면 글자 폭이 틀려 라벨이 잘린다. 한글 서브셋은 실제 글자를 넘겨야 내려받는다.
    try {
      await Promise.all(boxes.map((b) => document.fonts.load('14px "Pretendard Variable"', b.dataset.src)));
      await document.fonts.ready;
    } catch { /* 폰트가 없어도 그리긴 한다 */ }
    for (const box of boxes) {
      const src = box.dataset.src;
      if (svgCache.has(src)) { box.innerHTML = svgCache.get(src); continue; }
      try {
        const { svg } = await window.__mermaid.render(`mm-${++mmSeq}`, src);
        svgCache.set(src, svg);
        box.innerHTML = svg;
      } catch (e) {
        box.classList.add("err");
        box.textContent = `mermaid 렌더 실패\n${e?.message ?? e}`;
      }
    }
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  let revs = {}; // round -> 마지막으로 본 rev

  // 초안을 브라우저에 남긴다. 새로고침해도 같은 세션이면 그대로 돌아온다.
  // 세션 id로 키를 나누고 rev도 같이 저장해, 복원 뒤 지문 대조가 바뀐 질문을 걸러낸다.
  const storeKey = (id) => `grill-web:${id}`;
  function persist() {
    if (!sessionId) return;
    try { localStorage.setItem(storeKey(sessionId), JSON.stringify({ drafts, noteOpen, revs, at: Date.now() })); } catch { /* 사생활 보호 모드 등. 그냥 메모리로만 간다 */ }
  }
  function restore(id) {
    try {
      const saved = JSON.parse(localStorage.getItem(storeKey(id)) ?? "null");
      if (saved && typeof saved === "object") { drafts = saved.drafts ?? {}; noteOpen = saved.noteOpen ?? {}; revs = saved.revs ?? {}; return; }
    } catch { /* 깨진 값은 무시 */ }
    drafts = {}; noteOpen = {}; revs = {};
  }
  // 일주일 넘은 세션 초안만 정리한다. 다른 서버가 잠깐 같은 포트에 떠서 세션이 바뀌어 보여도 원래 초안은 남는다
  function prune() {
    try {
      for (const k of Object.keys(localStorage)) {
        if (!k.startsWith("grill-web:")) continue;
        const at = JSON.parse(localStorage.getItem(k) ?? "{}")?.at ?? 0;
        if (Date.now() - at > 7 * 86400e3) localStorage.removeItem(k);
      }
    } catch {}
  }

  // 라운드 파일이 고쳐졌을 때 기존 초안을 새 질문과 대조한다. 안 맞는 초안은 버리거나 잘라낸다.
  function reconcileDrafts(r) {
    const d = drafts[r.round];
    if (!d) return;
    for (const n of Object.keys(d)) {
      const q = (r.questions ?? []).find((x) => x.n === Number(n));
      const cur = d[n];
      if (!q) { delete d[n]; continue; }
      // 제목이나 종류가 바뀌었으면 다른 질문이다. 메모와 미룸까지 전부 버린다
      if (cur.fp !== fpOf(q)) { delete d[n]; continue; }
      const fresh = { value: q.kind === "multi" ? [] : "", note: cur.note ?? "", other: false, skip: !!cur.skip, fp: cur.fp };
      if (q.kind === "multi") {
        if (!Array.isArray(cur.value)) { d[n] = fresh; continue; }
        cur.value = cur.value.filter((v) => (q.options ?? []).includes(v));
      } else if (q.kind === "choice") {
        if (typeof cur.value !== "string" || (!cur.other && cur.value !== "" && !(q.options ?? []).includes(cur.value))) d[n] = fresh;
      } else if (q.kind === "yesno") {
        if (cur.value !== "" && cur.value !== "yes" && cur.value !== "no") d[n] = fresh;
      } else if (q.kind === "range") {
        if (cur.value !== "" && (typeof cur.value !== "number" || cur.value < (q.min ?? 0) || cur.value > (q.max ?? 100))) d[n] = fresh;
      } else if (typeof cur.value !== "string") {
        d[n] = fresh;
      }
      if (d[n].other && q.kind !== "choice") d[n] = fresh;
    }
  }
  // 답을 정하는 데 쓰이는 필드 전부. 하나라도 바뀌면 다른 질문으로 본다
  const fpOf = (q) => JSON.stringify([q.kind, q.title, q.options, q.min, q.max, q.step, q.unit, q.recommendation, q.body, q.why]);
  function draft(round, n) {
    drafts[round] ??= {};
    const q = currentRound?.questions?.find((x) => x.n === n);
    drafts[round][n] ??= { value: q?.kind === "multi" ? [] : "", note: "", other: false, skip: false, fp: q ? fpOf(q) : "" };
    return drafts[round][n];
  }
  function complete(q, d) {
    if (!KINDS.includes(q.kind)) return false;
    if (d.skip) return true;
    if (q.kind === "multi") return d.value.length > 0;
    if (q.kind === "text") return d.value.trim().length > 0;
    if (q.kind === "choice" && d.other) return d.value.trim().length > 0;
    return d.value !== "";
  }
  function answerText(q, a) {
    if (!a) return "";
    if (a.skipped) return "미룸";
    if (q.kind === "yesno") return a.value === "yes" ? "예" : a.value === "no" ? "아니요" : a.value;
    if (q.kind === "range") return `${a.value}${q.unit ?? ""}`;
    if (Array.isArray(a.value)) return a.value.join(", ");
    return a.value ?? "";
  }
  const remaining = () => currentRound ? currentRound.questions.filter((q) => !complete(q, draft(currentRound.round, q.n))).length : 0;
  const sendable = () => !!currentRound && (currentRound.questions ?? []).length > 0 && remaining() === 0;
  const skippedCount = () => currentRound ? currentRound.questions.filter((q) => draft(currentRound.round, q.n).skip).length : 0;
  function hintText() {
    if (!(currentRound?.questions ?? []).length) return "이 라운드에 질문이 없어요";
    const left = remaining(), sk = skippedCount();
    return (left ? `${left}개 남았어요` : "다 골랐어요") + (sk ? ` · ${sk}개 미룸` : "");
  }

  // 지금까지 주고받은 내용을 마크다운으로. 다른 에이전트나 문서에 붙여 넣는 용도.
  function transcript(state) {
    const past = (state.rounds ?? []).filter((r) => r.answers);
    let out = `# ${state.title || "grill"}\n`;
    for (const r of past) {
      out += `\n## 라운드 ${r.round}\n`;
      for (const q of r.questions ?? []) {
        const a = r.answers.answers.find((x) => x.n === q.n);
        out += `\n- **Q${q.n}. ${q.title}** → ${a?.skipped ? "(미룸)" : answerText(q, a)}`;
        if (a?.note) out += `\n  - ${a.note}`;
      }
      out += "\n";
    }
    const open = (state.rounds ?? []).find((r) => !r.answers);
    if (open && drafts[open.round]) {
      out += `\n## 라운드 ${open.round} (작성 중)\n`;
      for (const q of open.questions ?? []) {
        const d = drafts[open.round][q.n];
        if (!d) continue;
        const shown = d.skip ? "(미룸)" : complete(q, d) ? answerText(q, { value: d.value }) : "";
        if (shown) out += `\n- **Q${q.n}. ${q.title}** → ${shown}`;
        if (d.note) out += `\n  - ${d.note}`;
      }
      out += "\n";
    }
    if (state.summary) out += `\n## 정리\n\n${state.summary}\n`;
    return out;
  }

  function renderSide(state, open, past) {
    const qs = open?.questions ?? [];
    let nav = "";
    if (past.length || open) {
      nav = `<div class="nav">` +
        past.map((r) => `<button class="row head" data-jump="past-${r.round}"><span class="mark done"></span>라운드 ${r.round}</button>`).join("") +
        (open ? `<div class="row head now"><span class="mark now"></span>라운드 ${open.round}</div>` +
          qs.map((q) => { const d = draft(open.round, q.n); return `<button class="row q" data-jump="q-${q.n}"><span class="mark ${d.skip ? "skip" : complete(q, d) ? "done" : ""}"></span>Q${q.n}. ${esc(q.title)}</button>`; }).join("") : "") +
        `</div>`;
    }
    const cta = open ? `<p class="hint">${hintText()}</p><button class="send" data-send ${sendable() ? "" : "disabled"}>답변 보내기</button>` : "";
    const copy = (past.length || open) ? `<button class="ghost" data-copy>지금까지 마크다운으로 복사</button>` : "";
    side.innerHTML = `<div class="caption">grill</div><h1>${esc(state.title || "인터뷰")}</h1>
      <div class="meta">${state.summary ? "인터뷰 끝" : open ? `라운드 ${open.round} 진행 중` : "준비 중"}</div>${nav}<div class="side-cta">${cta}${copy}</div>`;
  }

  const KINDS = ["yesno", "choice", "multi", "range", "text"];
  function widgetFor(open, q, d) {
    const recs = [].concat(q.recommendation ?? []);
    const lb = `aria-labelledby="qt-${q.n}"`;
    if (q.kind === "yesno") return ["답", `<div class="seg" role="radiogroup" ${lb}>${["yes", "no"].map((v) =>
      `<button class="opt ${d.value === v ? "on" : ""}" role="radio" aria-checked="${d.value === v}" data-set="${q.n}" data-v="${v}">${v === "yes" ? "예" : "아니요"}${q.recommendation === v ? '<span class="pill">추천</span>' : ""}</button>`).join("")}</div>`];
    if (q.kind === "choice" || q.kind === "multi") {
      const multi = q.kind === "multi";
      const role = multi ? "checkbox" : "radio";
      const opts = (q.options ?? []).map((o) => {
        const on = multi ? d.value.includes(o) : (!d.other && d.value === o);
        return `<button class="opt ${on ? "on" : ""}" role="${role}" aria-checked="${on}" data-${multi ? "toggle" : "set"}="${q.n}" data-v="${esc(o)}"><span class="dot ${multi ? "sq" : ""}"></span><span>${esc(o)}</span>${recs.includes(o) ? '<span class="pill">추천</span>' : ""}</button>`;
      }).join("");
      const other = multi ? "" : `<div class="other ${d.other ? "on" : ""}"><button class="opt ${d.other ? "on" : ""}" role="radio" aria-checked="${d.other}" data-other="${q.n}"><span class="dot"></span><span>다른 답</span></button><input type="text" data-othertext="${q.n}" aria-label="다른 답" placeholder="직접 적어 주세요" value="${esc(d.other ? d.value : "")}"></div>`;
      return [multi ? "여러 개 골라도 돼요" : "하나 고르기", `<div class="opts" role="${multi ? "group" : "radiogroup"}" ${lb}>${opts}${other}</div>`];
    }
    if (q.kind === "range") {
      const num = (v, d) => (Number.isFinite(Number(v)) && v !== null && v !== "" ? Number(v) : d); // 숫자만 속성에 넣는다
      const min = num(q.min, 0), max = num(q.max, 100), step = num(q.step, 1);
      const has = d.value !== "";
      const rec = q.recommendation != null ? `<div class="rec"><span class="tag">추천</span><div class="txt">${esc(q.recommendation)}${esc(q.unit ?? "")}</div><button data-rec="${q.n}">이대로</button></div>` : "";
      // 아직 안 골랐으면 손잡이를 끝에 두고 흐리게. 추천값 자리에 두면 고른 것처럼 보인다
      return ["값 고르기", rec + `<div class="range"><div class="val ${has ? "" : "empty"}" aria-live="polite">${has ? esc(d.value) : "아직 안 골랐어요"}${has && q.unit ? `<small>${esc(q.unit)}</small>` : ""}</div>
        <input type="range" class="${has ? "" : "empty"}" data-range="${q.n}" ${lb} min="${min}" max="${max}" step="${step}" value="${has ? d.value : min}">
        <div class="ends"><span>${min}${esc(q.unit ?? "")}</span><span>${max}${esc(q.unit ?? "")}</span></div></div>`];
    }
    if (q.kind === "text") {
      const rec = q.recommendation ? `<div class="rec"><span class="tag">추천</span><div class="txt">${esc(q.recommendation)}</div><button data-rec="${q.n}">이대로</button></div>` : "";
      return ["자유롭게", rec + `<textarea data-text="${q.n}" ${lb} placeholder="생각나는 대로 적어 주세요">${esc(d.value)}</textarea>`];
    }
    return ["", `<div class="skipbox" role="alert"><b>답할 수 없는 질문이에요</b>알 수 없는 종류 <code>${esc(q.kind)}</code>입니다. 에이전트가 라운드 파일을 고쳐야 합니다.</div>`];
  }

  function renderQuestion(open, q) {
    const d = draft(open.round, q.n);
    const key = `${open.round}:${q.n}`;
    const [label, widget] = widgetFor(open, q, d);
    const why = q.why ? `<div class="why"><span class="label">추천 이유</span>${esc(q.why)}</div>` : "";
    const head = `<div class="q-head"><span class="caption">Q${q.n}</span>${q.deferred ? '<span class="pill">미뤄 둔 질문</span>' : ""}</div>`;
    const answer = d.skip
      ? `<div class="skipbox"><b>미뤄 뒀어요</b>다음 라운드에 다시 물어요. 지금 답하고 싶으면 되돌리세요.<br><button data-unskip="${q.n}">다시 답하기</button></div>`
      : `<div class="label">${label}</div>${widget}
        <div class="later">
          <div class="note ${noteOpen[key] || d.note ? "on" : ""}"><button class="note-toggle" data-note="${q.n}" aria-controls="note-${q.n}" aria-expanded="${!!(noteOpen[key] || d.note)}">이유나 조건 덧붙이기</button></div>
          <button data-skip="${q.n}">나중에 답할게요</button>
        </div>
        <div class="note ${noteOpen[key] || d.note ? "on" : ""}" id="note-${q.n}"><textarea data-notetext="${q.n}" aria-label="Q${q.n} 메모" placeholder="왜 그렇게 고르는지, 붙는 조건이 있는지">${esc(d.note)}</textarea>${!d.note ? `<button class="note-toggle" data-notehide="${q.n}">메모 접기</button>` : ""}</div>`;
    return `<section class="card ${d.skip ? "skipped" : ""}" id="q-${q.n}">
      <div class="ask">${head}<h2 class="q-title" id="qt-${q.n}">${esc(q.title)}</h2><div class="q-body">${body(q.body)}</div>${why}</div>
      <div class="answer">${answer}</div></section>`;
  }

  function renderPast(past) {
    if (!past.length) return "";
    return `<div class="history"><div class="caption">지난 라운드</div>` + past.map((r) => `
      <details class="past" id="past-${r.round}"><summary><span>라운드 ${r.round} · 질문 ${r.questions?.length ?? 0}개</span><span class="chev">▼</span></summary>
        <div class="past-grid">${(r.questions ?? []).map((q) => {
          const a = r.answers.answers.find((x) => x.n === q.n);
          return `<div class="past-q"><div class="t">Q${q.n}. ${esc(q.title)}</div><div class="a">${esc(answerText(q, a))}</div>${a?.note ? `<div class="n">${esc(a.note)}</div>` : ""}</div>`;
        }).join("")}</div></details>`).join("") + `</div>`;
  }

  // 라운드 파일은 에이전트가 쓴 것이라 형태를 믿지 않는다. 속성에 들어가는 값은 여기서 타입을 맞춘다
  const normQ = (q) => ({ ...q, n: Number(q.n), title: String(q.title ?? ""), kind: String(q.kind ?? ""), options: Array.isArray(q.options) ? q.options.map(String) : undefined });
  function render(state) {
    for (const r of state.rounds ?? []) if (Array.isArray(r.questions) && !r.__norm) { r.questions = r.questions.map(normQ); r.__norm = true; }
    const rounds = state.rounds ?? [];
    const open = rounds.find((r) => !r.answers) ?? null;
    const past = rounds.filter((r) => r.answers);
    currentRound = open;
    let html = "";
    if (state.summary) {
      html = `<span class="done-badge">인터뷰 끝</span><div class="summary">${sanitize(md(state.summary))}</div>` + renderPast(past);
      document.title = `끝 · ${state.title || "grill"}`;
    } else if (!open) {
      html = `<div class="waiting" role="status" aria-live="polite" aria-busy="true"><div class="spin"></div><div class="big">${past.length ? "다음 라운드를 준비하고 있어요" : "첫 라운드를 준비하고 있어요"}</div><div class="sub">답변을 읽고 다음 질문을 고르는 중이에요. 이 창은 그대로 두면 돼요.</div></div>` + renderPast(past);
      document.title = `대기 중 · ${state.title || "grill"}`;
    } else {
      const qs = open.questions ?? [];
      const left = remaining();
      html = `<div class="caption">라운드 ${open.round} · 질문 ${qs.length}개</div><h2 class="round-title">${esc(open.intro || (past.length ? "이어서 몇 가지 더" : "먼저 큰 방향부터"))}</h2>` +
        qs.map((q) => renderQuestion(open, q)).join("") +
        `<div class="bottom"><span class="hint">${hintText()}</span><button class="send" data-send ${sendable() ? "" : "disabled"}>답변 보내기</button></div>` + renderPast(past);
      document.title = `라운드 ${open.round} · ${state.title || "grill"}`;
    }
    main.innerHTML = html;
    persist();
    renderSide(state, open, past);
    hydrateMermaid();
  }

  function refreshProgress() {
    for (const b of document.querySelectorAll("[data-send]")) b.disabled = !sendable() || sending;
    for (const h of document.querySelectorAll(".hint")) h.textContent = hintText();
    for (const q of currentRound.questions) {
      const mark = side.querySelector(`[data-jump="q-${q.n}"] .mark`);
      const d = draft(currentRound.round, q.n);
      if (mark) { mark.classList.toggle("skip", d.skip); mark.classList.toggle("done", !d.skip && complete(q, d)); }
    }
  }

  // 전체를 다시 그린 뒤 키보드 포커스를 같은 자리로 되돌린다. data-* 속성과 data-v로 요소를 다시 찾는다
  function rerender() {
    if (!lastState) return;
    const a = document.activeElement;
    const key = a && [...a.attributes].find((x) => x.name.startsWith("data-") && x.name !== "data-v");
    const y = window.scrollY;
    render(lastState);
    window.scrollTo({ top: y });
    if (!key) return;
    const sel = `[${key.name}="${CSS.escape(key.value)}"]` + (a.dataset.v !== undefined ? `[data-v="${CSS.escape(a.dataset.v)}"]` : "");
    document.querySelector(sel)?.focus({ preventScroll: true });
  }

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.jump) {
      const el = document.getElementById(b.dataset.jump);
      if (el?.tagName === "DETAILS") el.open = true;
      el?.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (b.dataset.copy !== undefined) {
      try { await navigator.clipboard.writeText(transcript(lastState)); toast("복사했어요"); } catch { toast("복사하지 못했어요"); }
      return;
    }
    if (b.dataset.send !== undefined) return send();
    if (!currentRound) return;
    const r = currentRound.round;
    const n = Number(b.dataset.set ?? b.dataset.toggle ?? b.dataset.other ?? b.dataset.rec ?? b.dataset.note ?? b.dataset.notehide ?? b.dataset.skip ?? b.dataset.unskip);
    if (Number.isNaN(n)) return;
    const q = currentRound.questions.find((x) => x.n === n);
    const d = draft(r, n);
    if (b.dataset.set !== undefined) { d.value = b.dataset.v; d.other = false; }
    else if (b.dataset.toggle !== undefined) { const v = b.dataset.v; d.value = d.value.includes(v) ? d.value.filter((x) => x !== v) : [...d.value, v]; }
    else if (b.dataset.other !== undefined) { if (!d.other) { d.other = true; d.value = ""; } }
    else if (b.dataset.rec !== undefined) { d.value = q.recommendation; }
    else if (b.dataset.note !== undefined) { noteOpen[`${r}:${n}`] = true; }
    else if (b.dataset.notehide !== undefined) { noteOpen[`${r}:${n}`] = false; }
    else if (b.dataset.skip !== undefined) { d.skip = true; }
    else if (b.dataset.unskip !== undefined) { d.skip = false; }
    rerender();
    if (b.dataset.other !== undefined) document.querySelector(`[data-othertext="${n}"]`)?.focus();
    if (b.dataset.note !== undefined) document.querySelector(`[data-notetext="${n}"]`)?.focus();
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (!currentRound) return;
    const r = currentRound.round;
    if (t.dataset.text) { draft(r, Number(t.dataset.text)).value = t.value; refreshProgress(); }
    if (t.dataset.othertext) { draft(r, Number(t.dataset.othertext)).value = t.value; refreshProgress(); }
    if (t.dataset.notetext) draft(r, Number(t.dataset.notetext)).note = t.value;
    if (t.dataset.range) {
      const n = Number(t.dataset.range), q = currentRound.questions.find((x) => x.n === n);
      draft(r, n).value = Number(t.value);
      const v = t.closest(".range").querySelector(".val");
      v.classList.remove("empty"); t.classList.remove("empty");
      v.innerHTML = `${esc(t.value)}${q.unit ? `<small>${esc(q.unit)}</small>` : ""}`;
      refreshProgress();
    }
    persist();
  });

  async function send() {
    const r = currentRound;
    if (!r || !sendable() || sending) return;
    sending = true;
    for (const b of document.querySelectorAll("[data-send]")) b.disabled = true;
    const answers = r.questions.map((q) => {
      const d = draft(r.round, q.n);
      if (d.skip) return { n: q.n, value: null, note: d.note.trim(), skipped: true };
      const a = { n: q.n, value: d.value, note: d.note.trim() };
      if (q.kind === "choice" && d.other) a.other = true; // options 밖의 직접 쓴 답
      return a;
    });
    const res = await fetch("/api/answers", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ session: sessionId, round: r.round, rev: r.rev, answers }) }).catch(() => null);
    sending = false;
    if (!res || !res.ok) { const err = res ? await res.json().catch(() => ({})) : null; toast(err?.error ?? (res ? `보내지 못했어요 (${res.status})` : "서버에 닿지 못했어요")); refreshProgress(); return; }
    toast("보냈어요");
    delete drafts[r.round]; persist();
    await poll(true);
  }

  let pollSeq = 0, pollApplied = 0;
  async function poll(force) {
    const my = ++pollSeq;
    try {
      const s = await (await fetch("/api/state", { cache: "no-store" })).json();
      if (my < pollApplied) return; // 더 새 응답이 이미 반영됐다. 늦게 온 옛 응답은 버린다
      pollApplied = my;
      // 세션이 바뀌면(새 인터뷰 시작) 이 탭의 초안은 버린다. 라운드는 rev로 내용 변경까지 잡는다.
      if (s.session !== sessionId) { sessionId = s.session; restore(sessionId); prune(); }
      for (const r of s.rounds) {
        if (revs[r.round] !== undefined && revs[r.round] !== r.rev) reconcileDrafts(r);
        revs[r.round] = r.rev;
      }
      const sig = JSON.stringify([s.session, s.title, s.summary, s.rounds.map((r) => [r.round, r.rev, !!r.answers])]);
      const structure = JSON.stringify([s.session, !!s.summary, s.rounds.map((r) => [r.round, !!r.answers])]);
      const changed = sig !== last;
      const moved = structure !== lastStructure; // 라운드가 새로 오거나 끝났을 때만 맨 위로. 같은 라운드 수정은 자리 유지
      if (force || changed) { last = sig; lastStructure = structure; lastState = s; if (moved) render(s); else rerender(); if (moved) window.scrollTo({ top: 0 }); }
      pollFailures = 0; offline(false);
    } catch { if (++pollFailures >= 3) offline(true); /* 서버가 잠깐 없을 수 있다. 다음 폴링에서 다시 */ }
  }
  let pollFailures = 0;
  function offline(on) {
    const el = document.getElementById("offline");
    if (el) el.hidden = !on;
  }
  poll(true);
  setInterval(() => poll(false), 1500);
})();
</script>
</body>
</html>
